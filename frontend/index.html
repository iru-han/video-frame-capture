<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영상 프레임 캡처</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>영상 → 초 단위 사진 캡처</h1>

    <div class="form-row">
      <label for="videoFile">영상 파일</label>
      <input type="file" id="videoFile" accept="video/*">
    </div>

    <div class="form-row">
      <label for="interval">캡처 간격 (초)</label>
      <input type="number" id="interval" value="3" min="0.1" step="0.1">
    </div>

    <button id="convertBtn">변환</button>

    <div class="divider">또는</div>

    <div class="form-row">
      <label for="imageFiles">사진 여러 장</label>
      <input type="file" id="imageFiles" accept="image/*" multiple>
    </div>

    <button id="uploadImagesBtn">사진으로 라벨링 시작</button>

    <div id="statusText" class="status hidden"></div>

    <div id="warningBanner" class="warning hidden">
      <p id="warningText"></p>
      <button id="increaseIntervalBtn">간격 늘리기</button>
      <button id="proceedBtn">진행</button>
    </div>

    <div id="loading" class="loading hidden">처리 중... (프레임 추출 중)</div>

    <div class="gallery-controls">
      <label><input type="checkbox" id="hideLabeledToggle"> 라벨링 완료된 사진 숨기기</label>
    </div>

    <div id="gallery" class="gallery"></div>

    <div id="labelEditor" class="label-editor hidden">
      <div class="label-editor-header">
        <h2>라벨링</h2>
        <div class="nav-buttons">
          <button id="prevFrameBtn">← 이전</button>
          <button id="nextFrameBtn">다음 →</button>
        </div>
        <button id="closeLabelEditorBtn">닫기</button>
      </div>

      <div class="class-manager">
        <input type="text" id="newClassName" placeholder="클래스 이름 (예: leg)">
        <button id="addClassBtn">클래스 추가</button>
        <div id="classList" class="class-list"></div>
      </div>

      <div id="labelCanvasWrap" class="label-canvas-wrap">
        <img id="labelImage" alt="">
        <canvas id="labelCanvas"></canvas>
      </div>

      <div id="boxList" class="box-list"></div>

      <div class="label-editor-actions">
        <button id="saveLabelsBtn">라벨 저장</button>
      </div>
      <div id="labelStatus" class="status hidden"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
